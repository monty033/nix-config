# Must match the config version the pinned image reports (every 0.18.x reports
# 0.18-0; a patch bump within the series does not change it). Frigate treats a
# missing version as 0.13 and re-runs its whole migration chain on every start;
# because this file is re-rendered from this template each boot, the version the
# app writes back at runtime is discarded, so without this key every restart
# replays every migration. Bump it when an upgrade crosses a config version.
version: 0.18-0

mqtt:
  enabled: true
  host: 192.168.86.100
  port: 1883
  user: homeassistant
  password: "{FRIGATE_MQTT_PASSWORD}"

auth:
  enabled: false

database:
  path: /var/lib/frigate/frigate.db

detectors:
  ov:
    type: openvino
    device: GPU

model:
  path: /openvino-model/ssdlite_mobilenet_v2.xml
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr
  labelmap_path: /openvino-model/coco_91cl_bkgr.txt

ffmpeg:
  hwaccel_args: preset-intel-qsv-h264

record:
  enabled: true
  continuous:
    days: 1
  motion:
    days: 7
  alerts:
    retain:
      days: 10
  detections:
    retain:
      days: 10

snapshots:
  enabled: true
  retain:
    default: 10

review:
  alerts:
    required_zones: []
  detections:
    required_zones: []

timestamp_style:
  position: tr

detect:
  enabled: true

face_recognition:
  enabled: false

lpr:
  enabled: false

classification:
  bird:
    enabled: false
  custom:
    dog:
      enabled: true
      threshold: 0.8
      object_config:
        objects:
          - dog
        classification_type: sub_label

go2rtc:
  ffmpeg:
    bin: /usr/lib/ffmpeg/7.0/bin/ffmpeg
  rtsp:
    listen: :8554
  webrtc:
    listen: :8555
  api:
    listen: :1984
  streams:
    front_door:
      - rtsp://admin:{FRIGATE_CAMERA_PASSWORD}@192.168.10.54:554/cam/realmonitor?channel=1&subtype=0
      - "ffmpeg:front_door#audio=opus"
    back_door:
      - rtsp://admin:{FRIGATE_CAMERA_PASSWORD}@192.168.10.53:554/cam/realmonitor?channel=1&subtype=0
      - "ffmpeg:back_door#audio=opus"
    bella_room:
      - rtsp://admin:{FRIGATE_CAMERA_PASSWORD}@192.168.10.51:554/cam/realmonitor?channel=1&subtype=0
      - "ffmpeg:bella_room#audio=opus"
    girls_room:
      - rtsp://admin:{FRIGATE_CAMERA_PASSWORD}@192.168.10.50:554/cam/realmonitor?channel=1&subtype=0
      - "ffmpeg:girls_room#audio=opus"
    nursery:
      - rtsp://admin:{FRIGATE_CAMERA_PASSWORD}@192.168.10.52:554/cam/realmonitor?channel=1&subtype=0
      - "ffmpeg:nursery#audio=opus"
    elegoo_cc2_chamber:
      - "ffmpeg:http://192.168.20.20:8080/#video=h264#hardware=vaapi"

cameras:
  front_door:
    ffmpeg:
      output_args:
        record: preset-record-generic-audio-copy
      inputs:
        - path: rtsp://127.0.0.1:8554/front_door
          input_args: preset-rtsp-restream
          roles:
            - record
        - path: rtsp://admin:{FRIGATE_CAMERA_PASSWORD}@192.168.10.54:554/cam/realmonitor?channel=1&subtype=1
          roles:
            - detect
    record:
      enabled: true
      alerts:
        retain:
          days: 10
      detections:
        retain:
          days: 10
    detect:
      enabled: true
    objects:
      track:
        - person
    zones:
      Front_Porch:
        coordinates: 0.723,0.24,0.436,0.736,0.321,0.998,0.996,0.99,0.987,0.016,0.712,0.003
        loitering_time: 0
      Front_Lawn:
        coordinates: 0.721,0.197,0.475,0.199,0.331,0.297,0.137,0.477,0.075,0.546,0.084,0.999,0.319,0.998,0.721,0.241
        loitering_time: 0

  back_door:
    ffmpeg:
      output_args:
        record: preset-record-generic-audio-copy
      inputs:
        - path: rtsp://127.0.0.1:8554/back_door
          input_args: preset-rtsp-restream
          roles:
            - record
        - path: rtsp://admin:{FRIGATE_CAMERA_PASSWORD}@192.168.10.53:554/cam/realmonitor?channel=1&subtype=1
          roles:
            - detect
    record:
      enabled: true
      continuous:
        days: 1
      motion:
        days: 7
      alerts:
        retain:
          days: 10
      detections:
        retain:
          days: 10
    detect:
      enabled: true
    objects:
      track:
        - person
        - dog
      filters:
        person:
          mask:
            - 0.573,0.17,0.571,0.362,0.619,0.366,0.618,0.17
            - 0.672,0.422,0.75,0.425,0.753,0.669,0.677,0.674
    zones:
      Back_Stoop:
        coordinates: 0.001,0.702,0,0,0.186,0,0.198,0.646,0.361,0.92,0.326,0.998,0.179,0.997,0.072,0.779
        loitering_time: 0

  bella_room:
    ffmpeg:
      output_args:
        record: preset-record-generic-audio-copy
      inputs:
        - path: rtsp://127.0.0.1:8554/bella_room
          input_args: preset-rtsp-restream
          roles:
            - record
        - path: rtsp://admin:{FRIGATE_CAMERA_PASSWORD}@192.168.10.51:554/cam/realmonitor?channel=1&subtype=1
          roles:
            - detect
    record:
      enabled: true
      alerts:
        retain:
          days: 0.125
      detections:
        retain:
          days: 0.125
    detect:
      enabled: true
    objects:
      track:
        - person
    review:
      alerts:
        labels: []
      detections:
        labels: []

  girls_room:
    ffmpeg:
      output_args:
        record: preset-record-generic-audio-copy
      inputs:
        - path: rtsp://127.0.0.1:8554/girls_room
          input_args: preset-rtsp-restream
          roles:
            - record
        - path: rtsp://admin:{FRIGATE_CAMERA_PASSWORD}@192.168.10.50:554/cam/realmonitor?channel=1&subtype=1
          roles:
            - detect
    record:
      enabled: true
      alerts:
        retain:
          days: 0.125
      detections:
        retain:
          days: 0.125
    detect:
      enabled: true
    objects:
      track:
        - person
    review:
      alerts:
        labels: []
      detections:
        labels: []

  nursery:
    ffmpeg:
      output_args:
        record: preset-record-generic-audio-copy
      inputs:
        - path: rtsp://127.0.0.1:8554/nursery
          input_args: preset-rtsp-restream
          roles:
            - record
        - path: rtsp://admin:{FRIGATE_CAMERA_PASSWORD}@192.168.10.52:554/cam/realmonitor?channel=1&subtype=1
          roles:
            - detect
    record:
      enabled: true
      alerts:
        retain:
          days: 0.25
      detections:
        retain:
          days: 0.25
    detect:
      enabled: true
    objects:
      track:
        - person
    review:
      alerts:
        labels: []
      detections:
        labels: []

  kitchen:
    ffmpeg:
      hwaccel_args: []
      inputs:
        - path: "/run/frigate-snapshots/kitchen.jpg"
          input_args: "-readrate 1 -framerate 2 -loop 1 -f image2"
          roles:
            - detect
    detect:
      width: 640
      height: 480
      fps: 2
    record:
      enabled: false
    objects:
      track:
        - person

  elegoo_cc2_chamber:
    ffmpeg:
      output_args:
        record: preset-record-generic
      inputs:
        - path: rtsp://127.0.0.1:8554/elegoo_cc2_chamber
          input_args: preset-rtsp-restream
          roles:
            - record
    record:
      enabled: true
      continuous:
        days: 1
    detect:
      enabled: false
